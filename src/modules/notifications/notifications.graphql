scalar Date

type Query {
  allNotifications: [Notification]
  findOneNotification(id: ID!): Notification!
  findNotifications(idReceiver: ID, idSender: ID): [Notification]
}

type Mutation {
  createNotification(notification: NotificationInput!): Notification
}

type Notification {
  idNotif: ID!
  idReceiver: ID!
  idSender: ID!
  notifTitle: String!
  message: String!
  sendDate: Date!
}

input NotificationInput {
  idReceiver: ID!
  idSender: ID!
  notifTitle: String!
  message: String!
  sendDate: Date!
}
